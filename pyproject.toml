[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[project]
name = "markdown-to-canvas"
version = "0.2.0"
description = "Sync Markdown from a repo to Canvas LMS"
requires-python = ">=3.11"
dependencies = [
    "canvasapi>=3.3",
    "requests>=2.31",
    "click>=8.1",
    "pypandoc>=1.13",
    "pyyaml>=6.0",
    "tomli-w>=1.0",   # for writing TOML (tomllib reads only in stdlib)
    "python-dotenv>=1.0",
    "pathspec>=0.12",  # gitignore-style pattern matching for ignore files
]

[project.scripts]
markdown-to-canvas = "markdown_to_canvas.cli:main"

[project.optional-dependencies]
dev = [
    "pytest>=8.0",
    "pytest-mock>=3.14",
]
publish = [
    "mkdocs>=1.5",
    "mkdocs-material>=9.5",
]

[tool.hatch.build.targets.wheel]
packages = ["src/markdown_to_canvas"]

[tool.ruff.lint.per-file-ignores]
# cli.py intentionally places its local package imports after load_dotenv() so
# that CANVAS_API_TOKEN is in the environment before .config reads it at import
# time. See the comment above the load_dotenv() call in cli.py.
"src/markdown_to_canvas/cli.py" = ["E402"]

[tool.pytest.ini_options]
testpaths = ["tests"]
