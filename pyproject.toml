[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[project]
name = "github-to-canvas"
version = "0.1.0"
description = "Sync Markdown from a GitHub repo to Canvas LMS"
requires-python = ">=3.11"
dependencies = [
    "canvasapi>=3.3",
    "click>=8.1",
    "pypandoc>=1.13",
    "pyyaml>=6.0",
    "tomli-w>=1.0",   # for writing TOML (tomllib reads only in stdlib)
    "python-dotenv>=1.0",
]

[project.scripts]
github-to-canvas = "github_to_canvas.cli:main"

[project.optional-dependencies]
dev = [
    "pytest>=8.0",
    "pytest-mock>=3.14",
]

[tool.hatch.build.targets.wheel]
packages = ["src/github_to_canvas"]

[tool.pytest.ini_options]
testpaths = ["tests"]
